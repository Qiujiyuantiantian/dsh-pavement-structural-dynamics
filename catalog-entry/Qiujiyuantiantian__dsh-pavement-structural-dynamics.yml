url: https://github.com/Qiujiyuantiantian/dsh-pavement-structural-dynamics
name: pavement-structural-dynamics
category: engineering
description:
  en: >-
    Pavement structural dynamics as a judgement manual: 59 capability cards over 8 chapters
    covering moving-load response, dynamic material parameters, plate-on-elastic-foundation,
    FWD modulus back-calculation, fatigue and fracture, and steel-bridge-deck paving. Four of
    the eight chapters promise more than they deliver and the package documents that mismatch
    together with ~100 transcription defects. Refuses to invent numbers.
  zh: >-
    路面结构动力学判据手册：8 章 59 张能力卡，覆盖移动荷载响应、材料动态参数、板与弹性地基、
    FWD 模量反演、疲劳断裂、钢桥面铺装。八章中四章名不副实，插件把这处落差与约百处转录缺陷
    一并记录。宁缺毋滥，不编数字。
